<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKSTREAM - Built by Ajex46</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff}
header{position:sticky;top:0;background:#0f0f0f;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px;border-bottom:1px solid #222;z-index:100}
.search-wrap{flex:1;display:flex;background:#121212;border:1px solid #333;border-radius:24px;overflow:hidden}
.search-wrap input{flex:1;background:transparent;border:none;color:#fff;padding:10px 14px;outline:none}
.search-wrap button{background:#222;border:none;color:#fff;padding:10px 16px}
.grid{display:grid;gap:10px;padding:12px}
.card{background:#181818;border-radius:12px;overflow:hidden}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:10px}
.player-modal{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
.player-modal.open{display:flex}
.video-box{width:100%;aspect-ratio:16/9;background:#000}
.video-box iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>
<header>
<div style="font-weight:900">▶ BLACKSTREAM</div>
<div class="search-wrap"><input id="searchInput" placeholder="Search BLACKSTREAM..."><button onclick="doSearch()">🔍</button></div>
<div style="background:#fff;color:#000;padding:6px 12px;border-radius:20px;font-weight:700;font-size:11px">PREMIUM</div>
</header>
<div style="padding:14px"><h1 style="font-size:26px;font-weight:900">More Features Than YouTube.<br>Built by Ajex46</h1><p style="color:#aaa;font-size:12px;margin-top:6px">4K • Theatre • PiP • Ambient • Offline • Locked Profile</p></div>
<div class="grid" id="grid"></div>
<div class="player-modal" id="playerModal">
<div style="display:flex;justify-content:space-between;padding:10px"><button onclick="closePlayer()" style="background:#333;color:#fff;border:none;width:36px;height:36px;border-radius:50%">✕</button><span>4K PREMIUM</span></div>
<div class="video-box"><iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<h2 id="vTitle" style="padding:12px"></h2>
</div>
<script>
const videos=[
{id:'kJQP7kiw5Fk',title:'Luis Fonsi - Despacito (4K)',views:'8.4B',thumb:'https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg'},
{id:'RgKAFK5djSk',title:'Wiz Khalifa - See You Again (4K)',views:'6.1B',thumb:'https://i.ytimg.com/vi/RgKAFK5djSk/hqdefault.jpg'},
{id:'9bZkp7q19f0',title:'PSY - GANGNAM STYLE (4K)',views:'5.5B',thumb:'https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg'},
{id:'dQw4w9WgXcQ',title:'Avengers: Secret Wars Trailer (4K)',views:'89M',thumb:'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg'},
];
function render(list){const g=document.getElementById('grid');g.innerHTML='';list.forEach(v=>{const c=document.createElement('div');c.className='card';c.onclick=()=>{document.getElementById('ytFrame').src='https://www.youtube.com/embed/'+v.id+'?autoplay=1';document.getElementById('vTitle').innerText=v.title;document.getElementById('playerModal').classList.add('open')};c.innerHTML=`<div class="thumb"><img src="${v.thumb}"><span style="position:absolute;bottom:6px;right:6px;background:#000;padding:2px 6px;border-radius:4px;font-size:11px">4K</span></div><div class="info"><h3 style="font-size:13px">${v.title}</h3><p style="color:#aaa;font-size:11px">${v.views} • Ajex46 ✓</p></div>`;g.appendChild(c)})}
function closePlayer(){document.getElementById('playerModal').classList.remove('open');document.getElementById('ytFrame').src=''}
function doSearch(){const q=document.getElementById('searchInput').value.toLowerCase();render(videos.filter(v=>v.title.toLowerCase().includes(q)))}
render(videos);
</script>
</body>
</html>
